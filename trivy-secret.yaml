# Exceções à deteção de segredos do Trivy.
# Cada exceção deve ser o mais restrita possível: só o valor exato, nunca uma regra inteira.
allow-rules:
  - id: azurite-well-known-dev-key
    description: >-
      Chave pública e documentada do emulador Azurite (devstoreaccount1), incluída no código
      do @azure/storage-blob. Não dá acesso a nenhuma conta real.
      https://learn.microsoft.com/azure/storage/common/storage-use-azurite#http-connection-strings
    regex: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
