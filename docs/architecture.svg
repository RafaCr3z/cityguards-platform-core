<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="azGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#004578" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea4335" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4285f4" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="ciGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#461f8a" stop-opacity="0.5"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="38" text-anchor="middle" fill="#58a6ff" font-size="22" font-weight="700">CityGuards: Hybrid Multi-Cloud Architecture &amp; Platform Topology</text>
  <text x="550" y="62" text-anchor="middle" fill="#8b949e" font-size="13">Decoupled Microservices, Serverless Event Processing, and Automated IaC Deployments</text>

  <!-- ================= CLIENT TIER ================= -->
  <g transform="translate(40, 100)">
    <rect width="180" height="420" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="35" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">👤 Client Tier</text>
    <text x="90" y="55" text-anchor="middle" fill="#8b949e" font-size="11">Citizens &amp; Municipalities</text>

    <!-- Web / PWA -->
    <rect x="15" y="80" width="150" height="90" rx="8" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
    <text x="90" y="110" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">Next.js Web PWA</text>
    <text x="90" y="130" text-anchor="middle" fill="#8b949e" font-size="11">Civic Report Portal</text>
    <text x="90" y="150" text-anchor="middle" fill="#7ee787" font-size="10">Tailwind + TypeScript</text>

    <!-- Mobile Reporting -->
    <rect x="15" y="190" width="150" height="90" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="90" y="220" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="600">Mobile Client</text>
    <text x="90" y="240" text-anchor="middle" fill="#8b949e" font-size="11">Camera &amp; Geo-Location</text>
    <text x="90" y="260" text-anchor="middle" fill="#8b949e" font-size="10">HTTPS / REST Payloads</text>

    <!-- Admin Console -->
    <rect x="15" y="300" width="150" height="90" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="1"/>
    <text x="90" y="330" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="600">Admin Dashboard</text>
    <text x="90" y="350" text-anchor="middle" fill="#8b949e" font-size="11">Incident Management</text>
    <text x="90" y="370" text-anchor="middle" fill="#8b949e" font-size="10">Status &amp; Verification</text>
  </g>

  <!-- Line Client -> Azure -->
  <line x1="220" y1="200" x2="270" y2="200" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ================= AZURE CLOUD REGION ================= -->
  <rect x="280" y="90" width="460" height="440" rx="14" fill="url(#azGrad)" stroke="#0078d4" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="125" fill="#58a6ff" font-size="17" font-weight="700">☁️ Microsoft Azure Region (Compute &amp; AI Processing)</text>
  <text x="310" y="145" fill="#8b949e" font-size="11">Provisioned 100% via Azure Bicep (IaC) | rg-cityguards-prod</text>

  <!-- 1. Azure App Service -->
  <g transform="translate(310, 165)">
    <rect width="400" height="75" rx="8" fill="#161b22" stroke="#0078d4" stroke-width="1.5"/>
    <text x="20" y="30" fill="#58a6ff" font-size="14" font-weight="700">Azure App Service (Linux B1 SKU)</text>
    <text x="20" y="50" fill="#e6edf3" font-size="12">Next.js Core Application Runtime &amp; API Routes</text>
    <text x="20" y="65" fill="#8b949e" font-size="11">Zero-downtime deployment | Auto-scaling</text>
  </g>

  <!-- 2. Azure Blob Storage -->
  <g transform="translate(310, 255)">
    <rect width="190" height="110" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="15" y="25" fill="#58a6ff" font-size="12" font-weight="700">Azure Blob Storage</text>
    <text x="15" y="45" fill="#8b949e" font-size="10">• occurrences-photos</text>
    <text x="15" y="60" fill="#8b949e" font-size="10">• thumbnails</text>
    <text x="15" y="80" fill="#7ee787" font-size="10">Hot Access Tier (TLS 1.2)</text>
    <text x="15" y="98" fill="#8b949e" font-size="10">Event Grid Integration</text>
  </g>

  <!-- 3. Azure Cognitive Services / AI Vision -->
  <g transform="translate(520, 255)">
    <rect width="190" height="110" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="15" y="25" fill="#ff7b72" font-size="12" font-weight="700">Azure AI Vision</text>
    <text x="15" y="45" fill="#8b949e" font-size="10">• Auto Tagging &amp; Classification</text>
    <text x="15" y="60" fill="#8b949e" font-size="10">• Visual Moderation</text>
    <text x="15" y="80" fill="#e6edf3" font-size="10">Confidence Scoring</text>
    <text x="15" y="98" fill="#8b949e" font-size="10">Cognitive Services API</text>
  </g>

  <!-- 4. Azure Functions -->
  <g transform="translate(310, 380)">
    <rect width="400" height="125" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="20" y="25" fill="#f2cc60" font-size="13" font-weight="700">Azure Functions App (Serverless Event Workers)</text>
    
    <rect x="15" y="40" width="115" height="70" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="72" y="60" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">AnalyzeImageAI</text>
    <text x="72" y="78" text-anchor="middle" fill="#8b949e" font-size="9">Blob Trigger</text>
    <text x="72" y="94" text-anchor="middle" fill="#ff7b72" font-size="9">Vision API Call</text>

    <rect x="142" y="40" width="115" height="70" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="199" y="60" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">OptimizeImage</text>
    <text x="199" y="78" text-anchor="middle" fill="#8b949e" font-size="9">Thumbnail Gen</text>
    <text x="199" y="94" text-anchor="middle" fill="#58a6ff" font-size="9">Sharp / WebP</text>

    <rect x="270" y="40" width="115" height="70" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="327" y="60" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">CalculateScore</text>
    <text x="327" y="78" text-anchor="middle" fill="#8b949e" font-size="9">Gamification</text>
    <text x="327" y="94" text-anchor="middle" fill="#7ee787" font-size="9">ACID Update</text>
  </g>

  <!-- Line Azure -> GCP -->
  <line x1="740" y1="280" x2="790" y2="280" stroke="#4285f4" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ================= GCP REGION ================= -->
  <g transform="translate(800, 90)">
    <rect width="260" height="440" rx="14" fill="url(#gcpGrad)" stroke="#4285f4" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="35" fill="#79c0ff" font-size="16" font-weight="700">🌐 Google Cloud (GCP)</text>
    <text x="20" y="55" fill="#8b949e" font-size="11">Data Persistence Tier</text>

    <!-- Firestore -->
    <rect x="15" y="80" width="230" height="170" rx="8" fill="#161b22" stroke="#ffca28" stroke-width="1.5"/>
    <text x="25" y="110" fill="#f2cc60" font-size="14" font-weight="700">Google Cloud Firestore</text>
    <text x="25" y="130" fill="#e6edf3" font-size="11">NoSQL Document Store (ACID)</text>
    <text x="25" y="155" fill="#8b949e" font-size="10">• Real-time collection sync</text>
    <text x="25" y="172" fill="#8b949e" font-size="10">• Atomic transactions &amp; batches</text>
    <text x="25" y="189" fill="#8b949e" font-size="10">• Municipalities &amp; Occurrences</text>
    <text x="25" y="206" fill="#8b949e" font-size="10">• Gamified leaderboard rankings</text>
    <text x="25" y="230" fill="#7ee787" font-size="10">Strict Firestore Security Rules</text>

    <!-- Microservice: PDF Generator Container -->
    <rect x="15" y="270" width="230" height="140" rx="8" fill="#161b22" stroke="#2496ed" stroke-width="1.5"/>
    <text x="25" y="298" fill="#58a6ff" font-size="13" font-weight="700">🐳 PDF Export Microservice</text>
    <text x="25" y="320" fill="#8b949e" font-size="10">Express + Puppeteer in Container</text>
    <text x="25" y="340" fill="#8b949e" font-size="10">High-res municipal report generation</text>
    <text x="25" y="365" fill="#2496ed" font-size="10">Docker Containerized</text>
    <text x="25" y="390" fill="#7ee787" font-size="10">Stateless REST Endpoint</text>
  </g>

  <!-- ================= CI/CD & PLATFORM ENGINEERING ================= -->
  <g transform="translate(40, 555)">
    <rect width="1020" height="115" rx="12" fill="url(#ciGrad)" stroke="#a371f7" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="30" fill="#d2a8ff" font-size="15" font-weight="700">⚙️ Platform Engineering &amp; Zero-Secret CI/CD Pipeline (GitHub Actions + Azure Federated OIDC)</text>

    <!-- Step 1 -->
    <rect x="30" y="45" width="210" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="135" y="68" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">1. Git Push / PR Trigger</text>
    <text x="135" y="86" text-anchor="middle" fill="#8b949e" font-size="10">ESLint, TypeScript &amp; Bicep Lint</text>

    <!-- Step 2 -->
    <rect x="270" y="45" width="220" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="380" y="68" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">2. Container Security Scan</text>
    <text x="380" y="86" text-anchor="middle" fill="#ff7b72" font-size="10">Trivy Vulnerability Scanner</text>

    <!-- Step 3 -->
    <rect x="520" y="45" width="230" height="55" rx="6" fill="#161b22" stroke="#0078d4" stroke-width="1"/>
    <text x="635" y="68" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">3. Federated OIDC Auth</text>
    <text x="635" y="86" text-anchor="middle" fill="#7ee787" font-size="10">Azure Workload Identity (No Keys)</text>

    <!-- Step 4 -->
    <rect x="780" y="45" width="210" height="55" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
    <text x="885" y="68" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="600">4. Automated Deployment</text>
    <text x="885" y="86" text-anchor="middle" fill="#8b949e" font-size="10">ARM / Bicep + App Service</text>
  </g>
</svg>
