name: CityGuards Cloud Deployment & CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write  # Required for Azure OIDC Federated Authentication
  contents: read

jobs:
  # ============================================================================
  # Stage 1: Code Quality, Linting & Type Validation
  # ============================================================================
  validate-code:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ============================================================================
  # Stage 2: Infrastructure as Code (Bicep) Validation
  # ============================================================================
  validate-iac:
    name: Validate Azure Bicep IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Bicep Syntax
        run: |
          az bicep build --file infra/main.bicep

  # ============================================================================
  # Stage 3: Security & Container Vulnerability Scan
  # ============================================================================
  container-security-scan:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    needs: [validate-code, validate-iac]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Local Container Image for Scanning
        run: |
          docker build -t cityguards-app:local .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cityguards-app:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # Stage 4: Production Deployment via Federated OIDC
  # ============================================================================
  deploy-cloud:
    name: Azure Cloud Deployment (OIDC)
    runs-on: ubuntu-latest
    needs: [container-security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Log in to Azure using Federated OpenID Connect (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Infrastructure via Bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-cityguards-prod' }}
          template: ./infra/main.bicep
          parameters: prefix=cityguards appServiceSku=B1
          failOnStdErr: false
